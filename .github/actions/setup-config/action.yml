name: 'Setup Configuration'
description: '获取配置项（支持从 GitHub Secrets 或本地 .user.json 读取）并设置环境变量'

inputs:
  http-proxy:
    description: 'HTTP 代理地址'
    required: false
    default: 'http://127.0.0.1:7890'
  https-proxy:
    description: 'HTTPS 代理地址'
    required: false
    default: 'http://127.0.0.1:7890'
  report-server-url:
    description: '报告服务器地址'
    required: false
    default: 'http://192.168.52.77:8080'
  github-token:
    description: 'GitHub Token (默认使用 GITHUB_TOKEN)'
    required: false
    default: ${{ github.token }}
  feishu-webhook-url:
    description: '飞书 Webhook URL'
    required: false
    default: ''

outputs:
  FEISHU_WEBHOOK_URL:
    description: '飞书 Webhook URL'
    value: ${{ steps.setup-config.outputs.feishu_webhook_url }}
  PAT_TOKEN:
    description: 'GitHub Token (用于评论 PR)'
    value: ${{ steps.setup-config.outputs.pat_token }}
  HTTP_PROXY:
    description: 'HTTP 代理地址'
    value: ${{ steps.setup-config.outputs.http_proxy }}
  HTTPS_PROXY:
    description: 'HTTPS 代理地址'
    value: ${{ steps.setup-config.outputs.https_proxy }}
  REPORT_SERVER_URL:
    description: '报告服务器地址'
    value: ${{ steps.setup-config.outputs.report_server_url }}

runs:
  using: 'composite'
  steps:
    - name: Setup Configuration
      id: setup-config
      run: node "${{ github.action_path }}/setup.js"
      env:
        INPUT_HTTP_PROXY: ${{ inputs.http-proxy }}
        INPUT_HTTPS_PROXY: ${{ inputs.https-proxy }}
        INPUT_REPORT_SERVER_URL: ${{ inputs.report-server-url }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_FEISHU_WEBHOOK_URL: ${{ inputs.feishu-webhook-url }}

