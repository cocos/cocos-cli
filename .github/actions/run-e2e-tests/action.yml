name: 'Run E2E Tests'
description: '运行 E2E 测试并生成报告'

inputs:
  report-server-url:
    description: '报告服务器地址'
    required: true
    default: 'http://192.168.52.77:8080'
  debug:
    description: '是否以 debug 模式运行 E2E 测试（使用 npm run test:e2e:debug）'
    required: false
    default: 'false'

outputs:
  report_exists:
    description: '测试报告是否存在'
    value: ${{ steps.find-report-win.outputs.report_exists || steps.find-report-unix.outputs.report_exists }}
  report_url:
    description: '测试报告 URL'
    value: ${{ steps.find-report-win.outputs.report_url || steps.find-report-unix.outputs.report_url }}
  report_filename:
    description: '测试报告文件名'
    value: ${{ steps.find-report-win.outputs.report_filename || steps.find-report-unix.outputs.report_filename }}
  report_file:
    description: '测试报告文件路径'
    value: ${{ steps.find-report-win.outputs.report_file || steps.find-report-unix.outputs.report_file }}

runs:
  using: 'composite'
  steps:
    # Windows Steps
    - name: Run E2E tests (Windows)
      if: runner.os == 'Windows'
      id: run-tests-win
      shell: powershell
      continue-on-error: true
      run: |
        if ("${{ inputs.debug }}" -eq "true") {
          Write-Host "Running E2E tests in DEBUG mode..."
          npm run test:e2e:debug
        } else {
          Write-Host "Running E2E tests in normal mode..."
          npm run test:e2e
        }
    
    - name: Archive E2E logs (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        if (Test-Path "temp/logs") {
          $logDir = "e2e/logs/$(Get-Date -Format 'yyyy-MM-dd_HH-mm-ss')"
          New-Item -ItemType Directory -Force -Path $logDir
          Copy-Item -Path "temp/logs/*" -Destination "$logDir" -Recurse -Force
          Write-Host "E2E logs archived to $logDir"
        } else {
          Write-Host "No temp/logs directory found, skip archiving."
        }

    - name: Find test report file (Windows)
      if: runner.os == 'Windows'
      id: find-report-win
      shell: powershell
      run: node .github/scripts/find-test-report.js
    
    - name: Check test result (Windows)
      if: runner.os == 'Windows' && steps.run-tests-win.outcome == 'failure'
      shell: powershell
      run: exit 1

    # Unix Steps
    - name: Run E2E tests (Unix)
      if: runner.os != 'Windows'
      id: run-tests-unix
      shell: bash
      continue-on-error: true
      run: |
        if [ "${{ inputs.debug }}" = "true" ]; then
          echo "Running E2E tests in DEBUG mode..."
          npm run test:e2e:debug
        else
          echo "Running E2E tests in normal mode..."
          npm run test:e2e
        fi
    
    - name: Archive E2E logs (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        if [ -d "temp/logs" ]; then
          mkdir -p e2e/logs
          LOG_DIR="e2e/logs/$(date +%Y-%m-%d_%H-%M-%S)"
          mkdir -p "$LOG_DIR"
          cp -r temp/logs/* "$LOG_DIR"/ || true
          echo "E2E logs archived to $LOG_DIR"
        else
          echo "No temp/logs directory found, skip archiving."
        fi

    - name: Find test report file (Unix)
      if: runner.os != 'Windows'
      id: find-report-unix
      shell: bash
      run: node .github/scripts/find-test-report.js
    
    - name: Check test result (Unix)
      if: runner.os != 'Windows' && steps.run-tests-unix.outcome == 'failure'
      shell: bash
      run: exit 1
