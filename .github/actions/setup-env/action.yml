name: 'Setup Environment'
description: '初始化环境：安装依赖和构建项目'

runs:
  using: 'composite'
  steps:
    - name: Locate npm cache
      id: npm-config
      shell: bash
      run: |
        echo "path=$(npm config get cache)" >> "$GITHUB_OUTPUT"
        echo "node=$(node --version)" >> "$GITHUB_OUTPUT"

    - name: Restore npm downloads
      id: npm-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.npm-config.outputs.path }}
        key: npm-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.npm-config.outputs.node }}-${{ hashFiles('package-lock.json', 'repo.json') }}
        restore-keys: |
          npm-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.npm-config.outputs.node }}-

    - name: Restore platform tools
      id: tools-cache
      uses: actions/cache/restore@v4
      with:
        path: static/tools
        key: tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.MINIMAL_DOWNLOAD_TOOLS || 'false' }}-${{ hashFiles('workflow/download-tools.js') }}

    - name: Install node-gyp
      shell: bash
      run: npm i -g node-gyp

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Test SDK install and packaging workflows
      shell: bash
      run: |
        npm run test:install-workflow
        npm run test:pack-sdk
        npm run test:engine-compatibility

    - name: Fetch engine source explicitly
      shell: bash
      run: npm run update:repos

    - name: Install engine source dependencies explicitly
      shell: bash
      run: npm run install:engine
    
    - name: Prepare engine and CLI explicitly
      shell: bash
      env:
        COCOS_STRICT_TOOL_DOWNLOADS: 'true'
      run: node workflow/setup-dev.js --force

    - name: Save npm downloads
      if: steps.npm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.npm-config.outputs.path }}
        key: ${{ steps.npm-cache.outputs.cache-primary-key }}

    - name: Save platform tools
      if: steps.tools-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: static/tools
        key: ${{ steps.tools-cache.outputs.cache-primary-key }}

    - name: Test engine selection
      shell: bash
      run: |
        npm run test:engine-selection
        npm run test:engine-diagnostics

