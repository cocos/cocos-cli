name: Engine tag SDK matrix

on:
  workflow_call:
    inputs:
      cli_ref:
        description: CLI branch, tag or commit to test
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      cli_ref:
        description: 'CLI branch, tag or commit to test (empty uses the selected workflow commit)'
        required: false
        type: string

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=8192

concurrency:
  group: sdk-tag-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.value }}
      timestamp: ${{ steps.targets.outputs.timestamp }}
    steps:
      - uses: actions/checkout@v4
      - id: targets
        env:
          CANDIDATE_REF: ${{ inputs.cli_ref || github.sha }}
        run: |
          node -e 'const fs=require("fs");let targets=require("./workflow/sdk-maintained-clis.json");if(!Array.isArray(targets)||!targets.length)throw Error("Empty maintained CLI list");targets=targets.map((target,index)=>({...target,id:"target-"+index,ref:process.env.CANDIDATE_REF||target.ref}));fs.appendFileSync(process.env.GITHUB_OUTPUT,"value="+JSON.stringify(targets)+"\n");'
          node -e 'const stamp=new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",hourCycle:"h23"}).format(new Date()).replace(/\D/g,"").slice(2);require("fs").appendFileSync(process.env.GITHUB_OUTPUT,"timestamp="+stamp+"\n");'

  test:
    name: SDK tests (${{ matrix.target.runner }}, ${{ matrix.target.id }})
    needs: targets
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: ${{ fromJson(needs.targets.outputs.targets) }}
    uses: ./.github/workflows/sdk-target-tests.yml
    with:
      target: ${{ toJson(matrix.target) }}
      release_timestamp: ${{ needs.targets.outputs.timestamp }}

  gate:
    name: Engine SDK compatibility gate
    if: always()
    needs: [targets, test]
    runs-on: ubuntu-latest
    steps:
      - name: Require every stage to succeed
        env:
          STAGES: ${{ toJson(needs) }}
        run: node -e 'const stages=JSON.parse(process.env.STAGES);if(Object.values(stages).some(stage=>stage.result!=="success"))process.exit(1);'
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-plan-*
          path: plans
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-result-*
          path: results
      - name: Reconstruct complete expected coverage
        env:
          TARGETS: ${{ needs.targets.outputs.targets }}
        run: node workflow/sdk-ci-shards.js plan plans matrix.json
      - name: Require exact coverage and candidate identities
        run: node workflow/sdk-ci-shards.js aggregate matrix.json results
      - name: Approve Engine SDK artifacts for CLI publishing
        if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && (inputs.cli_ref == '' || inputs.cli_ref == github.sha)
        run: echo "Verified Engine SDKs can be reused by the CLI Publish workflow"

  verified:
    needs: [targets, gate]
    strategy:
      matrix:
        target: ${{ fromJson(needs.targets.outputs.targets) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdk-cli-${{ matrix.target.id }}
          path: bundle
      - name: Expose the original verified CLI test SDK
        uses: actions/upload-artifact@v4
        with:
          name: verified-cli-test-sdk-${{ matrix.target.id }}
          path: |
            bundle/cli.tar
            bundle/manifest.json
          compression-level: 0
          if-no-files-found: error
