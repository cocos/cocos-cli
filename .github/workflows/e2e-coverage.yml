# E2E 测试覆盖率检查工作流
#
# 触发方式：
# 1. 手动触发：在 GitHub Actions 页面点击 "Run workflow"
# 2. 评论触发：在 Issue 或 PR 中评论 "check e2e coverage"
#
# 功能：
# - 检查 E2E 测试覆盖率
# - 生成覆盖率报告
# - 在 PR 中自动评论覆盖率结果

name: E2E Coverage Check

on:
  # 手动触发
  workflow_dispatch:
  
  # 评论触发：在 Issue 或 PR 中评论 "check e2e coverage"
  issue_comment:
    types: [created]
  # PR 触发：当 PR 打开、更新或同步时检查描述
  pull_request:
    types: [opened, synchronize, reopened, edited]
env:
  # 配置覆盖率报告服务器地址
  REPORT_SERVER_URL: 'http://192.168.52.77:8080'

permissions:
  contents: read          # 读取代码
  issues: write          # 评论 Issue
  pull-requests: write   # 评论 PR

jobs:
  coverage-check:
    # 运行条件：
    # 1. 手动触发 (workflow_dispatch) - 直接运行
    # 2. 评论触发 (issue_comment) - 评论包含 "check e2e coverage"
    # 3. PR 触发 (pull_request) - PR 描述包含 "check e2e coverage"
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, 'check e2e coverage')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.body, 'check e2e coverage'))
      
    runs-on: [ self-hosted, macOS ]
    
    env:
      HAS_PAT_TOKEN: ${{ secrets.PAT_TOKEN != '' }}

    steps:
      - name: Check PAT_TOKEN configuration
        if: env.HAS_PAT_TOKEN == 'false'
        run: |
          echo "⚠️  PAT_TOKEN is not configured"
          echo "Comment features will be disabled"
          echo "See: .github/workflows/PAT-TOKEN-SETUP.md for setup instructions"
      
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: true
          fetch-depth: 0
          # 如果是评论触发，需要检出 PR 的代码
          ref: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number) || github.ref }}
      
      - name: Install dependencies
        run: npm i
      
      - name: Generate coverage report with Markdown
        id: coverage-report
        run: npm run check:e2e-coverage:report -- --markdown
      
      - name: Generate report URL
        if: always() && steps.coverage-report.outputs.report_path != ''
        run: |
          REPORT_FILE="${{ steps.coverage-report.outputs.report_path }}"
          REPORT_FILENAME=$(basename "$REPORT_FILE")
          
          # 生成报告 URL（CI 机器上的 http-server 已在运行）
          REPORT_URL="${{ env.REPORT_SERVER_URL }}/reports/$REPORT_FILENAME"
          echo "report_url=$REPORT_URL" >> $GITHUB_OUTPUT
          echo "report_filename=$REPORT_FILENAME" >> $GITHUB_OUTPUT
          
          echo "📊 Coverage Report URL: $REPORT_URL"
          echo "📄 Report file: $REPORT_FILE"
        id: report-url
      
      - name: Upload coverage report as artifact (备用)
        if: always() && steps.coverage-report.outputs.report_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-report-${{ github.run_id }}
          path: ${{ steps.coverage-report.outputs.report_path }}
          retention-days: 30

