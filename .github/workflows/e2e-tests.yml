# E2E 测试工作流 - PR 测试
#
# 触发方式：
# 1. 评论触发：在 Issue 或 PR 中评论 "run e2e test"
# 2. PR 触发：在 PR 描述中包含 "run e2e test"
#
# 功能：
# - 运行完整的 E2E 测试套件
# - 生成可视化的 HTML 测试报告
# - 在 PR 中自动评论测试结果和报告链接
# - 上传测试报告为 GitHub Artifacts（保留 30 天）
#
# 注意：此工作流不包含覆盖率检查，如需检查覆盖率请使用 e2e-coverage.yml

name: E2E Tests (PR)

on:
  # 评论触发：在 Issue 或 PR 中评论 "run e2e test"
  issue_comment:
    types: [created]
  
  # PR 触发：当 PR 打开、更新或同步时检查描述
  pull_request:
    types: [opened, synchronize, reopened]

env:
  # 配置测试报告服务器地址
  REPORT_SERVER_URL: 'http://192.168.52.77:8080'

permissions:
  contents: read          # 读取代码
  issues: write          # 评论 Issue
  pull-requests: write   # 评论 PR
  actions: read          # 读取 Actions
  checks: write          # 写入检查结果

jobs:
  e2e-tests:
    # 运行条件：
    # 1. 评论触发 (issue_comment) - 评论包含 "run e2e test"
    # 2. PR 触发 (pull_request) - PR 描述包含 "run e2e test"
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, 'run e2e test')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.body, 'run e2e test'))
    
    runs-on: [ self-hosted, macOS ]

    steps:
      - name: Add reaction to comment
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            try {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'rocket'
              });
              console.log('✅ Reaction added');
            } catch (error) {
              console.log('⚠️ Could not add reaction:', error.message);
            }
      
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: true
          fetch-depth: 0
          # 如果是评论触发，需要检出 PR 的代码
          # pull_request 事件会自动检出 PR 的 head
          ref: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number) || github.ref }}
      
      - name: Init
        run: npm run init

      - name: Install dependencies
        run: npm i
      
      - name: Run E2E tests
        run: npm run test:e2e
        continue-on-error: true
      
      - name: Find test report file
        if: always()
        id: find-report
        run: node .github/scripts/find-test-report.js
      
      - name: Upload test report to server
        if: always() && steps.find-report.outputs.report_exists == 'true'
        run: |
          echo "📤 Uploading test report to server..."
          echo "Report file: ${{ steps.find-report.outputs.report_file }}"
          echo "Report URL: ${{ steps.find-report.outputs.report_url }}"
          
          # 这里添加你上传报告到服务器的命令
          # 例如使用 scp, rsync, curl 等
          # scp ${{ steps.find-report.outputs.report_file }} user@server:/path/to/reports/
          # 或者
          # curl -F "file=@${{ steps.find-report.outputs.report_file }}" ${{ env.REPORT_SERVER_URL }}/upload

          echo "✅ Report uploaded successfully"
      
      - name: Upload test report as artifact (备用)
        if: always() && steps.find-report.outputs.report_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-report-${{ github.run_id }}
          path: ${{ steps.find-report.outputs.report_file }}
          retention-days: 30
      
      - name: Generate message content
        if: always()
        id: message
        run: |
          # 生成消息内容并保存到文件
          MESSAGE=$(node .github/scripts/generate-message.js)
          
          # 保存到 GitHub Output（处理多行）
          {
            echo 'content<<EOF'
            echo "$MESSAGE"
            echo 'EOF'
          } >> $GITHUB_OUTPUT
        env:
          REPORT_EXISTS: ${{ steps.find-report.outputs.report_exists }}
          REPORT_URL: ${{ steps.find-report.outputs.report_url }}
          REPORT_FILENAME: ${{ steps.find-report.outputs.report_filename }}
          GITHUB_RUN_ID: ${{ github.run_id }}
      
      - name: Comment on PR
        if: always() && (github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request))
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const comment = process.env.MESSAGE_CONTENT;
            
            // 获取 issue/PR 编号
            const issueNumber = context.issue?.number || context.payload.issue?.number;
            
            if (!issueNumber) {
              console.log('⚠️ Could not determine issue number');
              return;
            }
            
            console.log(`📝 Commenting on issue/PR #${issueNumber}`);
            
            try {
              // 查找已有的测试报告评论
              const { data: comments } = await github.rest.issues.listComments({
                issue_number: issueNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              
              const botComment = comments.find(c => 
                c.user.type === 'Bot' && 
                c.body.includes('E2E 测试报告')
              );
              
              if (botComment) {
                // 更新已有评论
                await github.rest.issues.updateComment({
                  comment_id: botComment.id,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
                console.log('✅ Comment updated');
              } else {
                // 创建新评论
                await github.rest.issues.createComment({
                  issue_number: issueNumber,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
                console.log('✅ Comment created');
              }
            } catch (error) {
              console.log('❌ Failed to comment:', error.message);
              console.log('Response status:', error.status);
              console.log('Response data:', JSON.stringify(error.response?.data, null, 2));
              throw error;
            }
        env:
          MESSAGE_CONTENT: ${{ steps.message.outputs.content }}

