name: Publish

on:
  workflow_dispatch:
    inputs:
      nodejs:
        description: 'Publish Node.js version'
        required: false
        default: true
        type: boolean
      electron:
        description: 'Publish Electron version'
        required: false
        default: false
        type: boolean
      create-zip:
        description: 'Create ZIP archive'
        required: true
        default: true
        type: boolean
      upload-ftp:
        description: 'Upload to FTP'
        required: true
        default: false
        type: boolean

jobs:
  release:
    name: Release on ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: npm install
      
    - name: Run Release
      run: |
        # Construct arguments based on inputs
        ARGS=""
        if [ "${{ inputs.nodejs }}" == "true" ]; then ARGS="$ARGS --nodejs"; fi
        if [ "${{ inputs.electron }}" == "true" ]; then ARGS="$ARGS --electron"; fi
        if [ "${{ inputs.create-zip }}" == "true" ]; then ARGS="$ARGS --zip"; fi
        if [ "${{ inputs.upload-ftp }}" == "true" ]; then ARGS="$ARGS --upload"; fi
        
        echo "Running release with args: $ARGS"
        npm run release -- $ARGS
      shell: bash
      env:
        # Secrets for signing and upload (configure in repo settings if needed)
        # CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        # APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        # FTP_HOST: ${{ secrets.FTP_HOST }}
        # FTP_USER: ${{ secrets.FTP_USER }}
        # FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        CI: true

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.os }}
        path: .publish/*.zip
        if-no-files-found: warn

