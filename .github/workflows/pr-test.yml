name: PR Test

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created]

jobs:
  pr-test:
    # 运行条件：
    # 1. PR 事件
    # 2. 评论触发 (包含 "rerun pr test"，包括 "rerun pr test:debug")
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, 'rerun pr test'))
    
    runs-on: [ self-hosted, pr-test ]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: true
          fetch-depth: 0
          # 如果是评论触发，需要检出 PR 的代码
          ref: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number) || github.ref }}
      
      - name: Setup configuration
        id: setup-config
        uses: ./.github/actions/setup-config
        with:
          feishu-webhook-url: ${{ secrets.FEISHU_WEBHOOK_URL }}
      
      - name: Setup environment
        uses: ./.github/actions/setup-env
      
      - name: Run unit tests
        id: unit-tests
        run: npm run test:quiet
      
      - name: Run E2E tests
        id: e2e-tests
        uses: ./.github/actions/run-e2e-tests
        with:
          report-server-url: ${{ steps.setup-config.outputs.REPORT_SERVER_URL }}
          # 如果是评论触发且包含 "rerun pr test:debug"，则以 debug 模式运行 E2E
          debug: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, 'rerun pr test:debug') }}
      
      - name: Check E2E coverage
        id: coverage
        uses: ./.github/actions/check-e2e-coverage
        with:
          report-server-url: ${{ steps.setup-config.outputs.REPORT_SERVER_URL }}
      

      - name: Generate PR comment
        if: always()
        id: message
        run: |
          node -e "
            const fs = require('fs');
            const os = require('os');
            
            // 获取状态和输出
            const unitOutcome = '${{ steps.unit-tests.outcome }}';
            const e2eOutcome = '${{ steps.e2e-tests.outcome }}';
            const reportUrl = '${{ steps.e2e-tests.outputs.report_url }}';
            const coverageUrl = '${{ steps.coverage.outputs.report_url }}';
            const coveragePercent = '${{ steps.coverage.outputs.coverage_percent }}';
            const testedCount = '${{ steps.coverage.outputs.tested_count }}';
            const totalCount = '${{ steps.coverage.outputs.total_count }}';
            const runId = '${{ github.run_id }}';
            
            let allPass = true;
            if (unitOutcome !== 'success') allPass = false;
            if (e2eOutcome !== 'success') allPass = false;
            
            let message = '';
            if (!allPass) {
              message += '## ⚠️ 发现问题\\n\\n';
            } else {
              message += '## ✅ 测试通过\\n\\n';
            }
            
            message += '| 类型 | 结果 |\\n';
            message += '|:----:|------|\\n';
            
            // 单元测试
            if (unitOutcome === 'success') {
              message += '| 🧪 | ✅ 单元测试 |\\n';
            } else {
              message += '| 🧪 | ❌ 单元测试失败 |\\n';
            }
            
            // E2E 测试
            if (e2eOutcome === 'success') {
              if (reportUrl) {
                message += '| 🔄 | ✅ E2E 测试 · [报告](' + reportUrl + ') |\\n';
              } else {
                message += '| 🔄 | ✅ E2E 测试 |\\n';
              }
            } else {
              if (reportUrl) {
                message += '| 🔄 | ❌ E2E 测试失败 · [查看报告](' + reportUrl + ') |\\n';
              } else {
                message += '| 🔄 | ❌ E2E 测试失败 |\\n';
              }
            }
            
            // 覆盖率
            if (coveragePercent && coverageUrl) {
              message += '| 📈 | 覆盖率 ' + coveragePercent + '% (' + testedCount + '/' + totalCount + ') · [详情](' + coverageUrl + ') |\\n';
            } else if (coverageUrl) {
              message += '| 📈 | 覆盖率报告 · [详情](' + coverageUrl + ') |\\n';
            } else {
              message += '| 📈 | ⚠️ 覆盖率检查失败 |\\n';
            }
            
            message += '\\n<sub>Run #' + runId + '</sub>\\n';
            message += '<!-- PR_TEST_COMMENT -->';
            
            // 写入 GITHUB_OUTPUT
            const output = process.env.GITHUB_OUTPUT;
            if (output) {
              fs.appendFileSync(output, 'content<<EOF' + os.EOL);
              fs.appendFileSync(output, message + os.EOL);
              fs.appendFileSync(output, 'EOF' + os.EOL);
            }
          "
      
      - name: Comment on PR
        if: always()
        uses: ./.github/actions/comment-on-pr
        with:
          pat-token: ${{ steps.setup-config.outputs.PAT_TOKEN }}
          message: ${{ steps.message.outputs.content }}
          comment-identifier: 'PR 测试报告'
